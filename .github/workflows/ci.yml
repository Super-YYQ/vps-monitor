name: Verify VPS Radar
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q
      - run: node --check app/static/app.js
      - run: bash -n deploy.sh
      - run: bash tests/test_deploy.sh
      - run: ADMIN_PASSWORD=ci-only-dummy-password docker compose config --quiet
      - run: docker build -t vps-radar:test .
