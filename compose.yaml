services:
  radar:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run bash deploy.sh or set ADMIN_PASSWORD in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - radar_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      radar:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  radar_data:
  caddy_data:
  caddy_config:
