[project]
name = "vps-radar"
version = "1.0.0"
description = "Self-hosted VPS restock monitor with a Chinese dashboard"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
